name: Build macOS App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install PySide6 --no-compile
          pip install numpy==1.23.5 scipy soundfile openpyxl
          pip install git+https://github.com/ebu/ebu_adm_renderer.git
          pip install pyinstaller==5.6.2
      
      - name: Build
        run: |
          pyinstaller \
            --windowed \
            --name "LouDuck" \
            --icon "assets/icon.icns" \
            --hidden-import=ear \
            --hidden-import=scipy.special._cdflib \
            --add-data "src/renderers:renderers" \
            --add-data "assets:assets" \
            --add-data "i18n:i18n" \
            --add-data "$(python -c 'import ear; print(ear.__path__[0])'):ear" \
            --add-data "$(python -c 'import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), "Qt", "plugins", "styles"))'):PySide6/Qt/plugins/styles" \
            src/main_gui.py
      
      - name: Set app version to 1.0.0
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" dist/LouDuck.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1.0.0" dist/LouDuck.app/Contents/Info.plist

      - name: Sign
        run: codesign --force --deep --sign - dist/LouDuck.app
      
      - name: Package
        run: |
          cd dist
          zip -r LouDuck-macOS-Intel.zip LouDuck.app
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LouDuck-macOS-Intel
          path: dist/LouDuck-macOS-Intel.zip
