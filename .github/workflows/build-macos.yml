name: Build macOS App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install PySide6 --no-compile
          pip install numpy==1.23.5 scipy soundfile openpyxl
          pip install git+https://github.com/ebu/ebu_adm_renderer.git
          pip install pyinstaller==5.6.2
      
      - name: Build
        run: |
          pyinstaller \
            --windowed \
            --name "ImmersiveLoudness" \
            --icon "assets/icon.icns" \
            --hidden-import=ear \
            --hidden-import=scipy.special._cdflib \
            --add-data "src/renderers:renderers" \
            --add-data "assets:assets" \
            --add-data "$(python -c 'import ear; print(ear.__path__[0])'):ear" \
            src/main_gui.py
      
      - name: Sign
        run: codesign --force --deep --sign - dist/ImmersiveLoudness.app
      
      - name: Package
        run: |
          cd dist
          zip -r ImmersiveLoudness-macOS-Intel.zip ImmersiveLoudness.app
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmersiveLoudness-macOS-Intel
          path: dist/ImmersiveLoudness-macOS-Intel.zip
