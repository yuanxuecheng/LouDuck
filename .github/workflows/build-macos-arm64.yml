name: Build macOS Apple Silicon

on:
  push:
    tags:
      - 'v*'

jobs:
  build-arm64:
    runs-on: macos-14  # Apple Silicon runner (M1)
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install PySide6 numpy scipy soundfile openpyxl
          pip install git+https://github.com/ebu/ebu_adm_renderer.git
          pip install pyinstaller
      
      - name: Build
        run: |
          pyinstaller \
            --windowed \
            --target-arch arm64 \
            --name "LouDuck" \
            --icon "assets/icon.icns" \
            --hidden-import=ear \
            --hidden-import=scipy.special._cdflib \
            --add-data "src/renderers:renderers" \
            --add-data "assets:assets" \
            --add-data "i18n:i18n" \
            --add-data "$(python -c 'import ear; print(ear.__path__[0])'):ear" \
            --add-data "$(python -c 'import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), "Qt", "plugins", "styles"))'):PySide6/Qt/plugins/styles" \
            src/main_gui.py
      
      - name: Set app version to 1.0.0
        run: |
          python3 - <<'PY'
          import plistlib
          p = 'dist/LouDuck.app/Contents/Info.plist'
          with open(p, 'rb') as f:
              d = plistlib.load(f)
          d['CFBundleShortVersionString'] = '1.0.0'
          d['CFBundleVersion'] = '1.0.0'
          with open(p, 'wb') as f:
              plistlib.dump(d, f)
          PY

      - name: Sign
        run: codesign --force --deep --sign - dist/LouDuck.app
      
      - name: Package
        run: |
          cd dist
          zip -r LouDuck-macOS-AppleSilicon.zip LouDuck.app
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LouDuck-macOS-AppleSilicon
          path: dist/LouDuck-macOS-AppleSilicon.zip
